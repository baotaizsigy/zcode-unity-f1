name: fetch-unity
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download
        run: |
          set -euo pipefail
          curl -L --fail --retry 8 --retry-delay 10 --retry-all-errors -o unity.exe "https://download.unity3d.com/download_unity/887be4894c44/Windows64EditorInstaller/UnitySetup64-2022.3.22f1.exe"
          ls -l unity.exe
          sha256sum unity.exe | tee unity.sha256
          split -b 1800M unity.exe unity.part.
          ls -l unity.part.*
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: unity-2022.3.22f1-intl
          name: Unity 2022.3.22f1 international installer
          files: |
            unity.part.*
            unity.sha256
