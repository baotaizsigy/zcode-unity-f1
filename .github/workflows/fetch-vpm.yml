name: fetch-vpm
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch VRChat SDK packages
        run: |
          set -euo pipefail
          mkdir -p vpm
          cd vpm
          UA="VRChatCreatorCompanion/2.3.2 (https://vrchat.com; support@vrchat.com)"
          curl -fsSL -A "$UA" --retry 5 --retry-delay 5 -o index.json "https://vrchat.github.io/packages/index.json"
          echo "=== packages ==="
          jq -r '.packages | keys[]' index.json
          echo "=== avatars versions (tail) ==="
          jq -r '.packages["com.vrchat.avatars"].versions | keys[]' index.json | sort -uV | tail -20
          AV=$(jq -r '.packages["com.vrchat.avatars"].versions | keys[]' index.json | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -uV | tail -1)
          echo "AVATARS=$AV"
          test -n "$AV"
          echo "=== avatars meta ==="
          jq -r --arg v "$AV" '.packages["com.vrchat.avatars"].versions[$v] | {version: .version, unity: .unity, dependencies: .dependencies, url: .url}' index.json
          DEPS=$(jq -r --arg v "$AV" '.packages["com.vrchat.avatars"].versions[$v].dependencies // {}' index.json)
          echo "DEPS=$DEPS"
          MAJMIN=$(echo "$AV" | cut -d. -f1,2)
          BASE=$(jq -r '.packages["com.vrchat.base"].versions | keys[]' index.json | grep -E "^${MAJMIN}\.[0-9]+$" | sort -uV | tail -1)
          if [ -z "$BASE" ]; then
            BASE=$(jq -r '.packages["com.vrchat.base"].versions | keys[]' index.json | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -uV | tail -1)
          fi
          echo "BASE=$BASE"
          test -n "$BASE"
          for spec in "com.vrchat.avatars:$AV" "com.vrchat.base:$BASE"; do
            p=${spec%%:*}
            v=${spec##*:}
            url=$(jq -r --arg p "$p" --arg v "$v" '.packages[$p].versions[$v].url' index.json)
            echo "DOWNLOAD $p $v <- $url"
            curl -fsSL -A "$UA" --retry 5 --retry-delay 5 -o "$p-$v.zip" "$url"
            sha256sum "$p-$v.zip" | tee "$p-$v.sha256"
          done
          ls -l
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vpm-sdk
          name: VRChat VPM packages
          files: |
            vpm/*.zip
            vpm/*.sha256
